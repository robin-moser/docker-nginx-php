ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot "${NGINX_SERVER_ROOT}"
    DirectoryIndex ${NGINX_INDEX}
    LimitRequestBody 67108864
    KeepAliveTimeout 65
    Timeout 180
    MergeSlashes Off

    RewriteEngine On
    RewriteCond expr "-n osenv('NGINX_DOMAIN')"
    RewriteCond expr "tolower(%{SERVER_NAME}) != tolower(osenv('NGINX_DOMAIN'))"
    RewriteCond %{HTTP_HOST} !^healthcheck\.local$ [NC]
    RewriteRule ^ https://${NGINX_DOMAIN}%{REQUEST_URI} [R=301,L,NE]

    RewriteCond %{REQUEST_URI} ^(.*?)//+(.*?)$
    RewriteRule ^ https://%{HTTP_HOST}%1/%2 [R=301,L,NE]

    <Directory "${NGINX_SERVER_ROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "(?i)\.(jpg|jpeg|gif|png|webp|ico|gz|svg|svgz|mp4|webm|woff|woff2|ttf|eot|pdf)$">
        Header set Cache-Control "public, max-age=31536000"
    </FilesMatch>
    <FilesMatch "(?i)\.(css|js)$">
        Header set Cache-Control "public, max-age=2678400"
    </FilesMatch>
    <FilesMatch "(?i)\.(html|txt|xsl|xml)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    DeflateCompressionLevel 5
    SetEnvIfExpr "osenv('NGINX_GZIP') == 'off'" no-gzip
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript text/xml \
        text/cache-manifest text/calendar text/markdown text/richtext text/vcard \
        text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy \
        application/font-woff application/font-woff2 application/atom+xml application/geo+json \
        application/javascript application/x-javascript application/json application/ld+json \
        application/manifest+json application/rdf+xml application/rss+xml application/vnd.ms-fontobject \
        application/wasm application/x-web-app-manifest+json application/xhtml+xml application/xml \
        font/eot font/otf font/ttf image/bmp image/svg+xml

    AliasMatch "^/ping$" /var/www/health/ping.php
    <Directory /var/www/health>
        Require local
    </Directory>

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^/(ping|favicon\.ico|robots\.txt)$" dontlog
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
